[package]
name = "mermdraw-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server addon for mermdraw: lets coding agents list, read, write and open the mermaid diagrams in your markdown"
license = "MIT"
readme = "README.md"
authors = ["berttoli"]
repository = "https://github.com/berttoli/mermdraw-mcp"
homepage = "https://github.com/berttoli/mermdraw-mcp"
keywords = ["mcp", "mermaid", "diagram", "markdown", "mermdraw"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
# rmcp 3.7 speaks MCP 2026-07-28 and still answers the legacy initialize handshake
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
